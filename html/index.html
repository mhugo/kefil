<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: sans-serif;
    }

    .tab {
        display: none;
    }

    .tab.active {
        display: flex;
        flex-wrap: wrap;
    }

    .tabs {
        display: flex;
        height: 5vh;
      justify-content: center;
    }

    .basket {
        width: 30%;
        height: 80vh;
      background-color: #007bff;
      color: white;
      overflow-y: auto;
      padding: 0;
      box-sizing: border-box;
      z-index: 10;
    }

    .footer {
        height: 15vh;
        width: 100%;
      background-color: #343a40;
      color: white;
      padding: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 10;
    }

    .total-text {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      text-align: end;
    }
    .remaining-text {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      text-align: end;
    }
    .remaining-text.positive {
        color: red;
    }

    .payment-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .pay-button {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
    }

    .pay-cash {
      background-color: #28a745;
      color: white;
    }

    .pay-card {
      background-color: #17a2b8;
      color: white;
    }

    .pay-button:active {
      transform: scale(0.97);
    }

    .content {
        width: 70%;
      overflow-y: auto;
      background-color: #f8f9fa;
      padding: 1rem;
      box-sizing: border-box;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 1rem;
    }

    .square-button {
      aspect-ratio: 1 / 1;
      background-color: #ffffff;
      border: 2px solid #007bff;
      color: #007bff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      border-radius: 0.5rem;
      font-size: 1.2rem;
    }

    .square-button:hover {
      background-color: #007bff;
      color: white;
    }

    .basket-list {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      margin: 0;
      padding: 0;
    }

    .basket-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 0.3rem 0.5rem;
      border-radius: 0.4rem;
    }

    .basket-item1 {
      font-size: 1.1rem;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 0.4rem;
      grid-column: 1 / 8;
    }
    .basket-item2 {
      font-size: 1.1rem;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 0.4rem;
      grid-column: 8 / 10;
      display: flex;
      justify-content: space-between;
    }
    

    .remove-button {
      background-color: #dc3545;
      border: none;
      color: white;
      font-size: 1.1rem;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
    }

    .remove-button:active {
      background-color: #c82333;
    }
.menu {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 20;
}

.dropdown {
  display: none;
  flex-direction: column;
  position: absolute;
  top: 2.5rem;
  right: 0;
  background-color: white;
  border: 1px solid #ccc;
  border-radius: 0.5rem;
  box-shadow: 0 0 8px rgba(0,0,0,0.1);
  padding: 0.5rem;
  z-index: 30;
}

.dropdown button {
  background: none;
  border: none;
  padding: 0.5rem;
  text-align: left;
  font-size: 1rem;
  cursor: pointer;
  color: #007bff;
}

.dropdown button:hover {
  background-color: #f0f0f0;
    }
    .tab-button {
      padding: 0.5rem 1rem;
      margin: 0 0.5rem;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 0.5rem;
    }

    .tab-button.active {
      background-color: #0056b3;
    }
</style>
</head>
<body>
  <div class="tabs">
    <button class="tab-button active" onclick="showTab('main')">Commande</button>
    <button class="tab-button" onclick="showTab('summary')">Résumé</button>
    <button class="tab-button" onclick="showTab('history')">Historique</button>
  </div>

  <div class="tab active" id="main">
    <div class="basket" id="basket">
      <div id="next_id"></div>
      <div class="basket-list" id="basketContent"></div>
      <div class="total-text" id="textTotal">Total: 0.00 €</div>
      <div class="total-text" id="textDiscount"></div>
      <div class="remaining-text" id="textRemaining"></div>
      <div class="total-text" id="textPayment"></div>
    </div>

    <div class="content">
      <div class="grid" id="buttonGrid"></div>
    </div>

    <div class="footer">
      <div class="payment-buttons">
        <button class="pay-button pay-cash" onclick="addPayment('Cash')">Cash</button>
        <button class="pay-button pay-card" onclick="addPayment('CB')">CB</button>
        <button class="pay-button" onclick="finalizePayment()">Valider</button>
      </div>
    </div>

  </div>

  <div class="tab" id="summary">
  </div>

  <div class="tab" id="history">
    <h1>Historique des commandes</h1>
    <ul id="orderList"></ul>
  </div>

  <script>
    function showTab(tabId) {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelectorAll('.tab-button').forEach(button => {
        button.classList.remove('active');
      });
      document.getElementById(tabId).classList.add('active');
      document.querySelector(`.tab-button[onclick="showTab('${tabId}')"]`).classList.add('active');

        const init_function_name = "init_tab_" + tabId;
        if (typeof window[init_function_name] == "function") {
            window[init_function_name]();
        }
    }

    function init_tab_main() {
        let currentDate = new Date().toJSON().slice(0, 10);
        const request = new Request(
            "/summary?date=" + currentDate, {
                method: "GET",
                headers: {
                    'Accept': 'application/json'
                }
            }
        );
        fetch(request)
            .then(response => response.json())
            .then(summary => {
                document.getElementById('next_id').innerHTML = `<b>Commande #${summary.last_id + 1}</b>`;
            });
    }
    function init_tab_history() {
      fetch('/orders')
        .then(response => response.json())
        .then(orders => {
          const orderList = document.getElementById('orderList');
          orderList.innerHTML = '';
          orders.forEach(order => {
            const li = document.createElement('li');
            li.textContent = `Commande #${order.id} - ${order.timestamp} - ${order.method} - Total: ${formatCents(order.total)}`;
            orderList.appendChild(li);
          });
        });
    }

    function init_tab_summary() {
        let currentDate = new Date().toJSON().slice(0, 10);
      fetch('/summary?date=' + currentDate)
            .then(response => response.text())
            .then(summaryText => {
                const summary = document.getElementById("summary");
                summary.innerHTML = summaryText;
            });
    }
    
    const config = {
        items: {{items_list|safe}}
    };

    const basket = {};

    let discount = 0;
    let paid = 0;
    let paymentMethod = '';
    

    function formatCents(cents) {
      return `${(cents / 100).toFixed(2)} €`;
    }

    function updateBasket() {
        const list = document.getElementById('basketContent');
        list.innerHTML = '';

        for (const key in basket) {
            const { id, item, quantity } = basket[key];
            const total = item.price * quantity;

          const info1 = document.createElement('div');
          info1.className = 'basket-item1';

          const info2 = document.createElement('div');
          info2.className = 'basket-item2';
          
          info1.textContent = `${item.label} - x${quantity}`;
          info2.textContent = `${formatCents(total)} `;

          const removeBtn = document.createElement('button');
          removeBtn.className = 'remove-button';
          removeBtn.textContent = '−';
          removeBtn.onclick = () => removeFromBasket(item);

          info2.appendChild(removeBtn);
          list.appendChild(info1);
          list.appendChild(info2);
      }
    }

    function computeTotal() {
        let total = 0;
        for (const key in basket) {
            const { id, item, quantity } = basket[key];
            total += item.price * quantity;
        }
        return total;
    }

    function updateTotal() {
        const textTotal = document.getElementById('textTotal');
        let total = computeTotal();
        textTotal.textContent = `Total: ${formatCents(total)}`;

        const textDiscount = document.getElementById('textDiscount');
        textDiscount.textContent = (discount > 0) ? `Remise: ${formatCents(discount)}` : '';

        const textRemaining = document.getElementById('textRemaining');
        let remaining = total - discount - paid;
        if (remaining > 0) {
            textRemaining.className = 'remaining-text positive';
        }
        else {
            textRemaining.className = 'remaining-text';
        }
        textRemaining.textContent = `Reste à payer: ${formatCents(remaining)}`;

        const textPayment = document.getElementById('textPayment');
        textPayment.textContent = (paymentMethod !== '') ? `Mode de paiement: ${paymentMethod}` : '';
    }

    function addToBasket(item) {
      if (!basket[item.id]) {
          basket[item.id] = { id: item.id, item, quantity: 0 };
      }
      basket[item.id].quantity += 1;
      updateBasket();
      updateTotal();
    }

    function removeFromBasket(item) {
      const entry = basket[item.id];
      if (entry && entry.quantity > 0) {
        entry.quantity -= 1;
        if (entry.quantity === 0) {
          delete basket[item.id];
        }
        updateBasket();
        updateTotal();
      }
    }

    function addPayment(method) {
        let total = computeTotal();
        paid = total - discount;
        paymentMethod = method;
        updateTotal();
    }

    function finalizePayment() {
        let total_basket = computeTotal();
        if (total_basket == 0 ) {
            window.alert("Panier vide !");
            return;
        }
        if (total_basket-discount > paid) {
            window.alert("Mode de paiement non renseigné !");
            return;
        }
        if (!window.confirm("La commande a t-elle bien été payée ?")) {
            return;
        }
        const orderItems = [];
        let total = 0;
        
        for (const key in basket) {
            const { id, item, quantity } = basket[key];
            const lineTotal = item.price * quantity;
            orderItems.push({
                id,
                quantity
            });
            total += lineTotal;
        }

        const order = {
            timestamp: new Date().toISOString(),
            method: paymentMethod,
            items: orderItems,
            total
        };

        console.log("Saving order:", order);
        const request = new Request(
            "/orders", {
                method: "POST",
                body: JSON.stringify(order),
                headers: {
                    'Content-Type': 'application/json; charset=utf-8'
                }
            }
        );
        fetch(request);

        // Clear basket
        for (const key in basket) {
            delete basket[key];
        }
        paid = 0;
        discount = 0;
        paymentMethod = '';
        updateBasket();
        updateTotal();
        showTab('main');
    }


    const grid = document.getElementById('buttonGrid');
    config.items.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'square-button';
        btn.textContent = item.label;
        btn.onclick = () => addToBasket(item);
        grid.appendChild(btn);
    });

    showTab('main');
  </script>
</body>
</html>
