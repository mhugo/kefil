<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="common.css">
  <style>

    /* Styles pour la table de résumé et l'historique */
    #summary {
      flex-direction: column;
      align-items: center; /* Centre horizontalement le contenu */
      padding: 1rem; /* Ajouter un peu de padding pour les bords */
      box-sizing: border-box;
      overflow-y: auto; /* Permet le défilement si le contenu dépasse */
    }

    #summary table {
        margin-bottom: 1.5rem; /* Marge uniforme */
        width: 100%; /* Prend toute la largeur disponible dans le parent (avec padding) */
        max-width: 800px; /* Limite la largeur pour une meilleure lisibilité sur grand écran */
        border-radius: 0.5rem; /* Bords arrondis pour la table/liste */
        overflow: hidden; /* Assure que les bordures arrondies sont respectées */
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        border-collapse: collapse; /* Assure que les bordures de table sont correctes */
    }

    #summary table th, #summary table td {
      border: 1px solid var(--border-color);
      padding: 0.8rem 1rem; /* Plus de padding */
      font-size: 1.1rem; /* Taille de police des données */
    }
    #summary table th {
      background-color: var(--background-dark);
      color: var(--text-color-light);
      text-align: left;
      font-weight: bold;
    }
    #summary table td.number {
      text-align: right;
      font-weight: bold;
      color: var(--primary-dark-color);
    }
    h1, h2 {
      color: var(--text-color-dark);
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      text-align: center; /* Centrer les titres */
    }

  </style>
</head>
<body>
  <div class="tabs">
    <a class="tab-button" href="/">Commande</a>
    <button class="tab-button active">Résumé</button>
    <a class="tab-button" href="/html_history">Historique</a>
  </div>

  <div class="tab-container">
    <div class="tab active" id="summary">
    </div>
  </div>

  <script>
    function init_tab_summary() {
        let currentDate = new URLSearchParams(document.location.search).get("date") || new Date().toJSON().slice(0, 10);
      fetch('/summary?date=' + currentDate)
            .then(response => response.text())
            .then(summaryText => {
                const summary = document.getElementById("summary");
                summary.innerHTML = summaryText;
            });
    }
    init_tab_summary();
  </script>
</body>
</html>
